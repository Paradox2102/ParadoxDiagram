# Deploy when a GitHub release is published. Railway auto-deploys the `release` branch (and only that branch), so
# this workflow checks the release, then moves `release` to the release's commit; Railway builds and deploys it.
# The release tag must be v<package.json version>, for example v1.0.0. A push to main never deploys.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (again), for example v1.0.0
        required: true

permissions:
  contents: write # to move the release branch

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://diagram.team2102.org
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::The tag $TAG does not match package.json ($want). Bump the version before the release."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Move the release branch to this release (Railway deploys it)
        run: |
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git push --force origin "$sha:refs/heads/release"
          echo "release -> $TAG ($sha)" >> "$GITHUB_STEP_SUMMARY"
