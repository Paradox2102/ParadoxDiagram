# Type check and tests on every push and pull request. Pushes do not deploy: a published release does (deploy.yml).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      # The Dockerfile's Caddy image, with the Caddyfile and the build: a bad Caddyfile fails here, not on Railway.
      - name: Caddy serves the build and passes the header check
        run: |
          docker run -d --name site -p 8080:8080 -e SITE_ROOT=/srv \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/dist:/srv:ro" caddy:2.11-alpine
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          bash scripts/check-headers.sh http://127.0.0.1:8080 || { docker logs site; exit 1; }
