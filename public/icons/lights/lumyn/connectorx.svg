<g id="anchors">
<circle class="anchor" id="anchor-usb" data-kind="usb" cx="41.5" cy="0.3" r="1" fill="none"><title>USB-C: Lumyn Studio, firmware and host link (data cable; logic power only)</title></circle>
<circle class="anchor" id="anchor-pwr_in" data-kind="power" cx="23.65" cy="-36.5" r="1" fill="none"><title>+12V IN screw terminal: robot 12 V (red +, black GND) from a fused PDH or PDP channel; no fuse or reverse-polarity protection on the board</title></circle>
<circle class="anchor" id="anchor-led_chan1" data-kind="signal" cx="-4.95" cy="38.98" r="1" fill="none"><title>CHAN 1: 3-pin JST VH 3.96 mm, GND / DATA / 5V, WS2812B strip (5 V, 320 LEDs max)</title></circle>
<circle class="anchor" id="anchor-uart" data-kind="signal" cx="-26.75" cy="22.4" r="1" fill="none"><title>UART header: 3.3V, TX, RX, GND from pin 1 (3.3 V logic, UART module or host link)</title></circle>
