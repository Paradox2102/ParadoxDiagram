<g class="lead-labels">
<text x="204" y="-25.2" font-size="2.2" fill="#1f2328" text-anchor="middle" font-weight="bold">5-pin 0.1 in female</text>
<text x="212.6" y="-20.28" font-size="1.9" fill="#1f2328" text-anchor="start" font-weight="bold">1 orange: pot -</text>
<text x="212.6" y="-17.74" font-size="1.9" fill="#1f2328" text-anchor="start" font-weight="bold">2 purple: wiper</text>
<text x="212.6" y="-15.2" font-size="1.9" fill="#1f2328" text-anchor="start" font-weight="bold">3 red: motor V+</text>
<text x="212.6" y="-12.66" font-size="1.9" fill="#1f2328" text-anchor="start" font-weight="bold">4 black: motor V-</text>
<text x="212.6" y="-10.12" font-size="1.9" fill="#1f2328" text-anchor="start" font-weight="bold">5 yellow: pot +</text>
</g>
<g class="caption">
<text x="110" y="24" font-size="4" fill="#1f2328" text-anchor="middle" font-weight="bold">Actuonix L16-P</text>
<text x="110" y="28.2" font-size="2.3" fill="#57606a" text-anchor="middle">20 × 177 mm · side view · 100 mm stroke, 63:1, 12 V · lead drawn short</text>
</g>
<g id="anchors">
<circle class="anchor" id="anchor-feedback" data-kind="signal" cx="210" cy="-19.81" r="1" fill="none"><title>Plug pins 1 and 2: potentiometer reference - (orange) and wiper (purple). Read the wiper on an analog input; reference + is pin 5 (feedback_ref)</title></circle>
<circle class="anchor" id="anchor-feedback_ref" data-kind="signal" cx="210" cy="-10.92" r="1" fill="none"><title>Plug pin 5: potentiometer reference + (yellow), to the analog input's supply (it is below the motor pair)</title></circle>
<circle class="anchor" id="anchor-power" data-kind="power" cx="210" cy="-14.73" r="1" fill="none"><title>Plug pins 3 and 4: motor leads, red V+ and black V- (reverse polarity to reverse). A motor controller drives them</title></circle>
</g>
</svg>
